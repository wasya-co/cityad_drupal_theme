# Schema for the configuration files of the CityAd Drupal Theme.

cityad_drupal_theme.settings:
  type: bootstrap_barrio.settings
  label: 'Cityad Drupal Theme settings'
  mapping:
    fancy_header:
      type: boolean
      label: 'Fancy header'
    logo_dol:
      type: sequence
      label: 'Logo DOL image'
      sequence:
        type: integer
        label: 'File ID'
    logo_lod:
      type: sequence
      label: 'Logo LOD image'
      sequence:
        type: integer
        label: 'File ID'
